replicaCount: 2

image:
  repository: fluxa/backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

worker:
  replicaCount: 3
  concurrency: 8
  image:
    repository: fluxa/worker
    tag: "latest"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

env:
  ENV: "production"
  DATABASE_NAME: "fluxa_prod"
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local:7233"

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi
