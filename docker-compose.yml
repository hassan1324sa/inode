version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - mongodb
      - temporal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - TEMPORAL_HOST=temporal:7233
      - TASK_QUEUE=fluxa-core
    depends_on:
      - mongodb
      - temporal
    command: python -m app.core.execution.temporal_worker

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  temporal:
    image: temporalio/dev:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/var/lib/temporal

volumes:
  mongo_data:
  temporal_data:
