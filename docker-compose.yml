
services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./kubernetes:/kubernetes
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - mongodb
      - temporal
    restart: on-failure
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - TEMPORAL_HOST=temporal:7233
      - TASK_QUEUE=fluxa-core
    depends_on:
      - mongodb
      - temporal
    restart: on-failure
    command: python -m app.core.execution.temporal_worker

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/var/lib/temporal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
  temporal_data:

